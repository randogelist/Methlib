name: HVR Windows PowerShell parser check
on:
  push:
    branches: [hvr-windows-parser-check]
  workflow_dispatch:
jobs:
  parser:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows PowerShell 5.1 scripts and frozen plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $folder = Join-Path $env:GITHUB_WORKSPACE '.github/powershell-validation'
          foreach ($file in @('canonical.ps1','integration.ps1','grid.ps1','prime_grid.ps1')) {
            $path = Join-Path $folder $file
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host ("PARSER_ERROR={0}:{1}:{2}" -f $file,$_.Extent.StartLineNumber,$_.Message) }
              throw "Parsing failed: $file"
            }
            Write-Host "PARSER_PASS=$file"
          }
          $canonical = Get-Content -LiteralPath (Join-Path $folder 'canonical.ps1') -Raw
          $match = [regex]::Match($canonical, '(?ms)^[ \t]*\$plan[ \t]*=[ \t]*@\([^\r\n]*\r?\n.*?^[ \t]*\)')
          if (-not $match.Success) { throw 'Canonical plan was not located' }
          $block = [scriptblock]::Create($match.Value + [Environment]::NewLine + 'return ,$plan')
          $plan = & $block
          $nameCount = ($plan | ForEach-Object { $_.names.Count } | Measure-Object -Sum).Sum
          Write-Host "CANONICAL_PLAN_COUNT=$($plan.Count)"
          Write-Host "CANONICAL_NAMED_AUDITS=$nameCount"
          if ($plan.Count -ne 120) { throw 'Unexpected canonical plan count' }
          if ($nameCount -ne 350) { throw 'Unexpected canonical audit count' }
          if ($plan[-1].module -ne 'HVR_PrimeDensity_FinalRoot') { throw 'Unexpected canonical final module' }
          Write-Host 'POWERSHELL_PLAN_CHECK=PASS'
      - name: Exercise launcher without an installed Lean toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP 'hvr-launcher-test'
          $pkg = Join-Path $sandbox 'HILBERT-SUPERIORITY-PNT'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE '.github/powershell-validation/top-run.cmd') (Join-Path $sandbox 'run.cmd')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'HILBERT-SUPERIORITY-PNT/run.cmd') $pkg
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'HILBERT-SUPERIORITY-PNT/run.ps1') $pkg
          $env:USERPROFILE = Join-Path $sandbox 'empty-user'
          $env:ELAN_HOME = Join-Path $sandbox 'empty-elan'
          $env:LEAN_EXE = Join-Path $sandbox 'missing-lean.exe'
          $out = @(& cmd.exe /d /c (Join-Path $sandbox 'run.cmd') 2>&1)
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 1) { throw "Expected graceful missing-toolchain exit; got $code" }
          if (-not ($out -match '^EVIDENCE=')) { throw 'Runner did not start' }
          if (-not ($out -match '^REASON=Lean_4_34_0_rc1_not_runnable_set_LEAN_EXE')) { throw 'Expected missing-toolchain diagnostic' }
          if (-not ($out -match '^LAUNCHER_EXIT_CODE=1')) { throw 'Expected launcher exit code' }
          Write-Host 'NO_LEAN_STARTUP_SMOKE=PASS'
