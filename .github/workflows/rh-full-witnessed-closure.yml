name: RH full witnessed closure admission scaffold

on:
  push:
    paths:
      - 'RH_FULL_WITNESSED_CLOSURE/**'
      - '.github/workflows/rh-full-witnessed-closure.yml'
  pull_request:
    paths:
      - 'RH_FULL_WITNESSED_CLOSURE/**'
      - '.github/workflows/rh-full-witnessed-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rh-full-witnessed-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-admission:
    name: Lean 4.33.0 / fail-closed witness admission
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PACKAGE: RH_FULL_WITNESSED_CLOSURE
      HVR_REV: c6b95fd9e3d792270026da083bddddbc72bacb22
      MATHLIB_REV: db584cd6d46c92f209a44c0f1c829460d327499d
      LEAN_NUM_THREADS: '4'
    defaults:
      run:
        shell: bash
        working-directory: RH_FULL_WITNESSED_CLOSURE

    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify frozen source manifest before dependency resolution
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ci/run_ci.py --check-source

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: RH_FULL_WITNESSED_CLOSURE
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Restore Mathlib cache archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/mathlib
          key: rh-full-witness-${{ runner.os }}-${{ runner.arch }}-${{ env.MATHLIB_REV }}

      - name: Resolve pinned HVR and Mathlib revisions
        run: |
          set -euo pipefail
          lake update
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.33.0'
          test "$(git -C .lake/packages/hilberVectorResolvent rev-parse HEAD)" = "$HVR_REV"
          test "$(git -C .lake/packages/mathlib rev-parse HEAD)" = "$MATHLIB_REV"
          lake exe cache get

      - name: Run architecture, negative control, and conditional admission gate
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 ci/run_ci.py | tee evidence/ci-summary.log

      - name: Upload independent compiler and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rh-full-witnessed-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: RH_FULL_WITNESSED_CLOSURE/evidence/
          if-no-files-found: warn
          retention-days: 90
