name: Erdos 687 Attempt_A external Jacobsthal proof

on:
  push:
    paths:
      - 'ERDOS_633/E0687/Attempt_A/**'
      - '.github/workflows/erdos-687-attempt-a.yml'
  pull_request:
    paths:
      - 'ERDOS_633/E0687/Attempt_A/**'
      - '.github/workflows/erdos-687-attempt-a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos687-attempt-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-endpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout Methlib revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout pinned OpenAI Jacobsthal proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openai/math
          ref: 1581d4cbdd69a0faf34b2089614fe2a814316a6a
          path: .ci-openai
          sparse-checkout: |
            lean
          persist-credentials: false

      - name: Checkout pinned external Erdős 687 bridge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: pw/erdosproblemaday-verification
          ref: 634b667ee7844f12590117c4c2d7bc0143f2fdd9
          path: .ci-referee
          sparse-checkout: |
            970/openai-jacobsthal-quadratic-refereed/bridge687
          persist-credentials: false

      - name: Free disk space for Mathlib caches
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .

      - name: Install pinned Lean from source manifest
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: .ci-openai/lean
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Restore official Mathlib archive cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mathlib
          key: erdos687-jacobsthal-mathlib-lean4341-d13f23b723b8a846827a245b89c10fc7d3f11612

      - name: Compile original proof, adapter, and theorem-level audit
        run: bash ERDOS_633/E0687/Attempt_A/ci/run.sh

      - name: Upload immutable build and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erdos687-attempt-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: ERDOS_633/E0687/Attempt_A/evidence/
          if-no-files-found: warn
          retention-days: 90
