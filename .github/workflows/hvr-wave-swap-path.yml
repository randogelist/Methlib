name: HVR Fourier wave swap-path diagnostic (Linux)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/hvr-candidates/wave-trace/**'
      - '.github/workflows/hvr-wave-swap-path.yml'

permissions:
  contents: read

jobs:
  right:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out the previously audited Fourier candidate snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: 27b98f2336b1fb1836ab8d43ac3e7801fbb3
          path: .ci-wave-source
          persist-credentials: false
      - name: Validate and select dependency-closed sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C "$GITHUB_WORKSPACE/.ci-wave-source" rev-parse HEAD)" = 27b98f2336b1fb1836ab8d43ac3e7801fbb3
          PKG="$GITHUB_WORKSPACE/.ci-wave-source/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          python3 "$PKG/prepare_lane.py" --package "$PKG" --output "$RUNNER_TEMP/hvr-wave-swap-path" --lane fubini_fourier_candidate
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify Mathlib and fetch cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Build and audit named declarations
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          python3 "$RUNNER_TEMP/hvr-wave-swap-path/run_linux.py"
      - name: Diagnose swap reachability
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/.ci-wave-source/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-wave-swap-path"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$EVIDENCE"
          DIAG="$GITHUB_WORKSPACE/.github/hvr-candidates/wave-trace"
          (cd "$DIAG" && sha256sum --check wave-trace.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$DIAG" && timeout 480 "$LEAN" HVRWaveSwapPathTrace.lean) | tee "$EVIDENCE/wave-swap-path.stdout.log"
          grep -F 'SWAP_PATH_FOUND=HVRWaveSwapPathControl.indirect' "$EVIDENCE/wave-swap-path.stdout.log" >/dev/null
          grep -E '^SWAP_PATH_|^DEPENDENCY_COVERAGE=' "$EVIDENCE/wave-swap-path.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload candidate audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-wave-swap-path-linux-evidence
          path: ${{ runner.temp }}/hvr-wave-swap-path/evidence-linux/
          if-no-files-found: warn
