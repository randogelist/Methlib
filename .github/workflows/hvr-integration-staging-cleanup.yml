name: Remove completed integration staging branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hvr-integration-staging-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main' && github.event.before == '9e492da55f8e55b7db71fdadbcee0f71c1009419'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete only the verified integration staging ref
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/heads/merge_major_mathlib_integration'
          actual="$(git ls-remote --exit-code --heads origin "$ref" | cut -f1)"
          test "$actual" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$actual" "$GITHUB_SHA"
          git push --force-with-lease="$ref:$actual" origin ":$ref"
          echo 'STAGING_BRANCH_DELETED=1'
