name: Close the merged HVR working branch

on:
  push:
    paths:
      - '.github/workflows/hvr-close-final-temporary.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  close-working-branch:
    if: github.repository == 'randogelist/Methlib' && github.ref == 'refs/heads/hvr-consolidated-grid-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for the exact branch commit to merge and close safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == randogelist/Methlib ]] || { echo 'REPOSITORY_MISMATCH'; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/hvr-consolidated-grid-20261104 ]] || { echo 'BRANCH_MISMATCH'; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'INVALID_EXPECTED_SHA'; exit 1; }
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'INVALID_RUN_ID'; exit 1; }
          branch='hvr-consolidated-grid-20261104'
          ref="refs/heads/$branch"
          expected="$GITHUB_SHA"
          merged=0
          for attempt in {1..60}; do
            actual="$(git ls-remote --heads origin "$ref" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then echo 'ALREADY_CLOSED'; exit 0; fi
            if [[ "$actual" != "$expected" ]]; then echo "BRANCH_MOVED_ABORT=$branch"; exit 1; fi
            git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
            if git merge-base --is-ancestor "$expected" refs/remotes/origin/main; then
              echo "EXPECTED_COMMIT_MERGED=$expected"
              merged=1
              break
            fi
            echo "WAITING_FOR_MAIN=$attempt"
            sleep 20
          done
          if (( ! merged )); then echo 'MAIN_MERGE_WAIT_TIMEOUT'; exit 1; fi
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.protected')"
          if [[ "$protected" != false ]]; then echo 'PROTECTED_BRANCH_ABORT'; exit 1; fi
          prs="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls?state=open&head=randogelist%3A$branch&per_page=100" --jq 'length' | awk '{n+=$1} END {print n+0}')"
          [[ "$prs" =~ ^[0-9]+$ ]] || { echo 'INVALID_PR_COUNT'; exit 1; }
          if (( prs > 0 )); then echo "OPEN_PULL_REQUESTS_ABORT=$prs"; exit 1; fi
          idle=0
          for attempt in {1..60}; do
            busy=0
            for status in queued in_progress waiting requested pending; do
              n="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&status=$status&per_page=100" --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length" | awk '{n+=$1} END {print n+0}')"
              [[ "$n" =~ ^[0-9]+$ ]] || { echo 'INVALID_RUN_COUNT'; exit 1; }
              busy=$((busy+n))
            done
            if (( busy == 0 )); then idle=1; break; fi
            echo "WAITING_FOR_OTHER_RUNS=$busy:$attempt"
            sleep 20
          done
          if (( ! idle )); then echo 'OTHER_RUNS_WAIT_TIMEOUT'; exit 1; fi
          # Repeat the safety checks immediately before deletion.
          actual="$(git ls-remote --heads origin "$ref" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo 'BRANCH_MOVED_ABORT'; exit 1; }
          git fetch --no-tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$expected" refs/remotes/origin/main || { echo 'MAIN_NO_LONGER_CONTAINS_COMMIT'; exit 1; }
          protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.protected')"
          [[ "$protected" == false ]] || { echo 'PROTECTED_BRANCH_ABORT'; exit 1; }
          prs="$(gh api --paginate --method GET "repos/$GITHUB_REPOSITORY/pulls?state=open&head=randogelist%3A$branch&per_page=100" --jq 'length' | awk '{n+=$1} END {print n+0}')"
          [[ "$prs" =~ ^[0-9]+$ ]] || { echo 'INVALID_PR_COUNT'; exit 1; }
          if (( prs > 0 )); then echo "OPEN_PULL_REQUESTS_ABORT=$prs"; exit 1; fi
          git push --force-with-lease="$ref:$expected" origin ":$ref"
          echo "CLOSED_BRANCH=$branch"

