name: HVR merged-branch cleanup (one-shot)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hvr-merged-branch-cleanup.yml'

permissions:
  contents: write

jobs:
  close-merged-branches:
    if: github.ref == 'refs/heads/main' && github.event.before == 'b94c05adb888b464099eeb37ef22e13c68c4cfc2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Delete only the four expected merged refs
        shell: bash
        run: |
          set -euo pipefail
          names=(
            prime-spectral-amendment-check
            hvr-full-native-chain-check
            hvr-native-rebuild-candidates
            hvr-prime-power-reindex-check
          )
          expected=(
            b996c463942d5835cfd46bf68cda850e13250976
            c85e0f21228f443cf4e09df9d061e8e58a3c0bd0
            1ba1e660c27471dfceb4925b46a3b8c99939fcfc
            "$GITHUB_SHA"
          )
          leases=()
          deletions=()
          for i in "${!names[@]}"; do
            ref="refs/heads/${names[$i]}"
            actual="$(git ls-remote --exit-code --heads origin "$ref" | cut -f1)"
            if [[ "$actual" != "${expected[$i]}" ]]; then
              echo "REF_CHANGED=$ref EXPECTED=${expected[$i]} ACTUAL=$actual"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$actual" "$GITHUB_SHA"; then
              echo "REF_NOT_MERGED=$ref"
              exit 1
            fi
            echo "REF_VERIFIED=$ref SHA=$actual"
            leases+=("--force-with-lease=$ref:$actual")
            deletions+=(":$ref")
          done
          git push --atomic "${leases[@]}" origin "${deletions[@]}"
          echo 'MERGED_BRANCHES_DELETED=4'
