name: Close already-merged HVR branches

on:
  push:
    paths:
      - '.github/workflows/hvr-close-merged-temporary.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  close-merged:
    if: github.repository == 'randogelist/Methlib' && github.ref == 'refs/heads/hvr-consolidated-grid-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and remove unchanged merged branch references
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          declare -a leases=()
          declare -a refspecs=()
          declare -a selected=()
          while read -r branch expected; do
            [[ "$branch" =~ ^[A-Za-z0-9_-]+$ ]] || { echo "INVALID_BRANCH=$branch"; exit 1; }
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_EXPECTED_SHA=$branch"; exit 1; }
            [[ "$branch" != main && "$branch" != hvr-consolidated-grid-20261104 ]] || { echo "FORBIDDEN_BRANCH=$branch"; exit 1; }
            ref="refs/heads/$branch"
            actual="$(git ls-remote --heads origin "$ref" | awk '{print $1}')"
            if [[ -z "$actual" ]]; then echo "SKIP_MISSING=$branch"; continue; fi
            if [[ "$actual" != "$expected" ]]; then echo "SKIP_CHANGED=$branch"; continue; fi
            if ! git merge-base --is-ancestor "$actual" "$main_sha"; then echo "SKIP_UNMERGED=$branch"; continue; fi
            protected="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.protected')"
            if [[ "$protected" != false ]]; then echo "SKIP_PROTECTED=$branch"; continue; fi
            busy=0
            for status in queued in_progress waiting requested pending; do
              n="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&status=$status&per_page=1" --jq '.total_count')"
              [[ "$n" =~ ^[0-9]+$ ]] || { echo "INVALID_RUN_COUNT=$branch"; exit 1; }
              if (( n > 0 )); then busy=1; break; fi
            done
            if (( busy )); then echo "SKIP_ACTIVE_RUN=$branch"; continue; fi
            open_prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=randogelist:$branch&per_page=1" --jq 'length')"
            [[ "$open_prs" =~ ^[0-9]+$ ]] || { echo "INVALID_PR_COUNT=$branch"; exit 1; }
            if (( open_prs > 0 )); then echo "SKIP_OPEN_PR=$branch"; continue; fi
            selected+=("$branch")
            echo "VERIFIED_MERGED_UNCHANGED=$branch"
            leases+=("--force-with-lease=$ref:$expected")
            refspecs+=(":$ref")
          done <<'BRANCHES'
          hvr-prime-right-grid-20261104 9ae77611a01933255ea5772750b59cabbba6825e
          major_mathlib_fourier_decay be3ff33cb8025680b034719a3628ec6c388902e3
          BRANCHES
          if (( ${#refspecs[@]} == 0 )); then echo 'NOTHING_ELIGIBLE'; exit 0; fi
          current_main="$(git ls-remote --heads origin refs/heads/main | awk '{print $1}')"
          if [[ "$current_main" != "$main_sha" ]]; then echo 'MAIN_MOVED_ABORT'; exit 1; fi
          git push --atomic "${leases[@]}" origin "${refspecs[@]}"
          for branch in "${selected[@]}"; do
            if [[ -n "$(git ls-remote --refs origin "refs/heads/$branch")" ]]; then
              echo "ERROR_REF_REMAINS=$branch"; exit 1
            fi
            echo "DELETED_BRANCH=$branch"
          done
          echo "DELETED_COUNT=${#refspecs[@]}"

