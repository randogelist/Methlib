name: HVR one-dimensional Fourier foundations trace (Linux)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/hvr-candidates/wave-one-dim/**'
      - '.github/workflows/hvr-wave-one-dim.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          (cd "$GITHUB_WORKSPACE/.github/hvr-candidates/wave-one-dim" && sha256sum --check diagnostic.sha256)
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify pinned Mathlib and fetch cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Trace 1D foundations (not a new theorem audit)
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$GITHUB_WORKSPACE/.ci-mathlib/.lake/build/lib/lean"
          for d in "$GITHUB_WORKSPACE"/.ci-mathlib/.lake/packages/*/.lake/build/lib/lean; do
            if [ -d "$d" ]; then export LEAN_PATH="$LEAN_PATH:$d"; fi
          done
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          DIAG="$GITHUB_WORKSPACE/.github/hvr-candidates/wave-one-dim"
          (cd "$DIAG" && "$LEAN" HVRWaveOneDimDependencyTrace.lean) | tee "$RUNNER_TEMP/one-dim-trace.log"
          grep -F 'POSITIVE_CONTROL_DETECTED=HVRWaveOneDimDependencyTraceControl.indirect|MeasureTheory.integral_integral_swap' "$RUNNER_TEMP/one-dim-trace.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|ROOT_UNKNOWN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE' "$RUNNER_TEMP/one-dim-trace.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-one-dim-foundations-trace
          path: ${{ runner.temp }}/one-dim-trace.log
          if-no-files-found: warn
