name: Erdos 687 Attempt C cached Lean certificate
on:
  push:
    paths:
      - 'ERDOS_633/E0687/Attempt_C/**'
      - '.github/workflows/erdos-687-attempt-c.yml'
  pull_request:
    paths:
      - 'ERDOS_633/E0687/Attempt_C/**'
      - '.github/workflows/erdos-687-attempt-c.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erdos-687-attempt-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certified-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PACKAGE: ERDOS_633/E0687/Attempt_C
      MATHLIB_REV: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
      LEAN_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Free runner space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Cached compatible Mathlib dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/mathlib
          key: erdos-687-attempt-c-mathlib-${{ runner.os }}-${{ runner.arch }}-fd9375dc1
      - name: Download pinned Mathlib objects
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATHLIB_REV"
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          "$HOME/.elan/bin/lake" exe cache get
          if ! test -s .lake/build/lib/lean/Mathlib.olean; then
            "$HOME/.elan/bin/lake" env lean -j"$LEAN_NUM_THREADS" -o .lake/build/lib/lean/Mathlib.olean Mathlib.lean
          fi
          test -s .lake/build/lib/lean/Mathlib.olean
      - name: Compile and theorem-level axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/erdos687-objects" "$GITHUB_WORKSPACE/$PACKAGE/evidence"
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN_EXE" --version | tee "$GITHUB_WORKSPACE/$PACKAGE/evidence/compiler.txt"
          sha256sum "$PACKAGE/ERDOS_687_CRT_BKQR.lean" | tee "$GITHUB_WORKSPACE/$PACKAGE/evidence/source.sha256"
          (
            cd .ci-mathlib
            "$HOME/.elan/bin/lake" env lean -j4 -o "$RUNNER_TEMP/erdos687-objects/ERDOS_687_CRT_BKQR.olean" "$GITHUB_WORKSPACE/$PACKAGE/ERDOS_687_CRT_BKQR.lean"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/$PACKAGE/evidence/core-build.log"
          python3 "$PACKAGE/ci/audit.py" "$GITHUB_WORKSPACE/$PACKAGE/evidence/core-build.log" | tee "$GITHUB_WORKSPACE/$PACKAGE/evidence/audit.txt"
      - name: Publish compiler and axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: erdos-687-attempt-c-${{ github.run_id }}-${{ github.run_attempt }}
          path: ERDOS_633/E0687/Attempt_C/evidence/
          if-no-files-found: warn
