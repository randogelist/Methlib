name: HVR prime Mellin mode root (Linux)
on:
  push:
    branches: [hvr-prime-mellin-mode-root]
    paths:
      - 'HILBERT-SUPERIORITY-PNT/mode-root-probe/**'
      - '.github/workflows/hvr-prime-mellin-mode-root.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mode-root:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify pinned Mathlib and fetch its cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Build and audit refactored root and named mode theorems
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          python3 HILBERT-SUPERIORITY-PNT/mode-root-probe/run_linux.py
      - name: Diagnose original and new Mellin dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/mode-root-probe"
          EVIDENCE="$(find "$PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'MODE_DIAGNOSTIC=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check diagnostics.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && "$LEAN" HVRModeDependencyDiagnostic.lean) | tee "$EVIDENCE/mode-diagnostic.stdout.log"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/mode-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload named audits and dependency diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-prime-mellin-mode-root-evidence
          path: HILBERT-SUPERIORITY-PNT/mode-root-probe/evidence-linux/
          if-no-files-found: warn
