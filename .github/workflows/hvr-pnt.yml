name: HVR theta PNT (Linux)

on:
  push:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '.github/workflows/hvr-pnt.yml'
  pull_request:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '.github/workflows/hvr-pnt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify all original Lean sources and build plan
        shell: bash
        run: |
          set -euo pipefail
          echo "64fe7a61f7009ab2a62b5f5c4d0a017ac67eedeb91f08714ed84348209479ca9  HILBERT-SUPERIORITY-PNT/original_sources.sha256" | sha256sum --check
          (cd HILBERT-SUPERIORITY-PNT && sha256sum --check original_sources.sha256)

      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Fetch pinned Mathlib cache
        working-directory: .ci-mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get

      - name: Build and audit theta root
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          "$LEAN_EXE" --version
          python3 HILBERT-SUPERIORITY-PNT/hvr_linux.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hvr-theta-linux-evidence
          path: HILBERT-SUPERIORITY-PNT/evidence-linux/
          if-no-files-found: warn
