name: HVR theta PNT

on:
  push:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '.github/workflows/hvr-pnt.yml'
  pull_request:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '.github/workflows/hvr-pnt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leanprover-community/mathlib4
          ref: de5ce8a9a66a4aa68a9bdbb35b63a06d34d9ca11
          path: .ci-mathlib
          persist-credentials: false

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Fetch Mathlib cache
        working-directory: .ci-mathlib
        shell: pwsh
        run: |
          if ((Get-Content lean-toolchain -Raw).Trim() -ne 'leanprover/lean4:v4.34.0-rc1') { throw 'Unexpected Mathlib toolchain' }
          $lake = Join-Path $env:USERPROFILE '.elan\bin\lake.exe'
          if (-not (Test-Path -LiteralPath $lake -PathType Leaf)) { throw "Elan Lake executable not found: $lake" }
          & $lake exe cache get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify original root and audit source hashes
        shell: pwsh
        run: |
          $checks = @{
            'HILBERT-SUPERIORITY-PNT/HVR_PrimeDensity_FinalRoot.lean' = '69c5ed8806b9cec089e70c4dc7422e5f442feef1d4138b51a355e0475d04423b'
            'HILBERT-SUPERIORITY-PNT/Audit_HVR_PrimeDensity_FinalRoot.lean' = '84fbc235a599207ccfcd894a5c47646394c579b1827f70b6078a4664b0ff6136'
          }
          foreach ($path in $checks.Keys) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            Write-Host "$path SHA256=$hash"
            if ($hash -ne $checks[$path]) { throw "Source hash mismatch: $path" }
          }

      - name: Build and audit theta root
        shell: pwsh
        run: |
          $env:MATHLIB_CACHE_ROOT = Join-Path $env:GITHUB_WORKSPACE '.ci-mathlib'
          # run.cmd starts Windows PowerShell 5.1; include its native modules when
          # invoked from the GitHub-hosted PowerShell 7 environment.
          $nativeModules = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules'
          $sharedModules = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          $env:PSModulePath = "$nativeModules;$sharedModules;$env:PSModulePath"
          & (Join-Path $env:GITHUB_WORKSPACE 'HILBERT-SUPERIORITY-PNT/run.cmd')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hvr-theta-evidence
          path: HILBERT-SUPERIORITY-PNT/evidence/
          if-no-files-found: warn
