name: HVR theta PNT (Linux)

on:
  push:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '!HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration/**'
      - '.github/workflows/hvr-pnt.yml'
  pull_request:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/**'
      - '!HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration/**'
      - '.github/workflows/hvr-pnt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify branch Lean sources and build plan
        shell: bash
        run: |
          set -euo pipefail
          echo "6cb9e4b951e1c2ec986c482950028cba81dd7074f4f238ec81d1f1810c9a4064  HILBERT-SUPERIORITY-PNT/branch_sources.sha256" | sha256sum --check
          (cd HILBERT-SUPERIORITY-PNT && sha256sum --check branch_sources.sha256)

      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Fetch pinned Mathlib cache
        working-directory: .ci-mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get

      - name: Build and audit theta root
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          "$LEAN_EXE" --version
          python3 HILBERT-SUPERIORITY-PNT/hvr_linux.py

      - name: Diagnose DCT dependencies of root and half-line theorem
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          export HVR_CAND="$HVR_PKG/major-mathlib/major_mathlib_dominated_convergence"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          test -f "$HVR_EVIDENCE/lean-path.txt"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$HVR_CAND/candidates" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRDCTTraceControlLeaf.olean" HVRDCTTraceControlLeaf.lean)
          (cd "$HVR_CAND/candidates" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRDCTTraceControlBridge.olean" HVRDCTTraceControlBridge.lean)
          "$LEAN_EXE" "$HVR_CAND/diagnostics/HVRRootDCTDiagnostic.lean" | tee "$HVR_EVIDENCE/root-dct-diagnostic.stdout.log"
          echo 'Root diagnostic reports findings; it does not assert semantic independence.' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|TARGET_MODULE_DECLARATIONS_COUNT|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-dct-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Diagnose Mellin dependency of root and Abel helper
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          export HVR_DIAG="$HVR_PKG/mellin-diagnostics"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          test -f "$HVR_EVIDENCE/lean-path.txt"
          test -f "$HVR_EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$HVR_DIAG" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRMellinTraceControlLeaf.olean" HVRMellinTraceControlLeaf.lean)
          (cd "$HVR_DIAG" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRMellinTraceControlBridge.olean" HVRMellinTraceControlBridge.lean)
          "$LEAN_EXE" "$HVR_DIAG/HVRMellinRootDiagnostic.lean" | tee "$HVR_EVIDENCE/root-mellin-diagnostic.stdout.log"
          echo 'Mellin diagnostic reports selected declaration findings; negative coverage remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|TARGET_MODULE_DECLARATIONS_COUNT|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-mellin-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose refactored prime-mode dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRModeDependencyDiagnostic.lean" | tee "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeMellinModeAssembly.primeSeries_eq_mul_mellin_via_modes' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRZetaBoundaryFactor.zeta_boundary_finite_order|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRZetaLogDerivative.vonMangoldt_series_eq_zeta_log_deriv|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|riemannZeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose Chebyshev bound dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRChebyshevDependencyDiagnostic.lean" | tee "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeChebyshevBound.theta_le_log4_mul_x_native' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Chebyshev.theta_le_log4_mul_x' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose integrated Fourier replacement
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRFourierTargetDiagnostic.lean" | tee "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log"
          grep -Fx 'FOURIER_CANDIDATE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRActualBoundaryFourier.ordinaryBoundary_tendsto_zero' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FOURIER_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Real.tendsto_integral_exp_smul_cocompact' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >/dev/null
          grep -E '^FOURIER_' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose near-pole dependency
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRPoleFeatureTrace.lean" | tee "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log"
          grep -Fx 'FEATURE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeZetaPoleLittleO.zeta_log_derivative_regularized_isLittleO' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FEATURE_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|log_deriv_riemannZeta_add_inv_sub_sub_isLittleO' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >/dev/null
          grep -E '^FEATURE_' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct frequency measurability
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRFrequencyMeasurableTrace.lean" | tee "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log"
          grep -Fx 'FREQ_MEAS_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FREQ_MEAS_TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >/dev/null
          grep -E '^FREQ_MEAS_' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct complex exponential path
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRComplexExpDirectTrace.lean" | tee "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log"
          grep -Fx 'EXP_DIRECT_TARGET_FOUND=HVRComplexPoleLaplace.exponential_integrable|HVRComplexExpIntegralDirect.exponential_integrable_direct' "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log" >/dev/null
          grep -E '^EXP_DIRECT_' "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose real reflection and residual swap paths
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          for NAME in HVRRealReflectionTrace HVRPrimeResidualSwapTrace; do
            "$LEAN" "$HVR_PKG/mellin-diagnostics/$NAME.lean" | tee "$HVR_EVIDENCE/$NAME.stdout.log"
            grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/$NAME.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          done
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRRealReflection.real_volume_negInvariant_direct|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/HVRRealReflectionTrace.stdout.log" >/dev/null

      - name: Inspect explicit root swap path
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          timeout 480 "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRPrimeSwapPathTrace.lean" | tee "$HVR_EVIDENCE/root-swap-path.stdout.log"
          for ENTRY in \
            'HVRPrimeSwapPathControl.swapDirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.swapIndirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.convolutionDirect|Real.fourier_mul_convolution_eq' \
            'HVRPrimeSwapPathControl.convolutionIndirect|Real.fourier_mul_convolution_eq'; do
            grep -Fx "PATH_CONTROL_DETECTED=$ENTRY" "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          done
          ROOT_OBSERVATIONS="$(grep -Ec '^PATH_TARGET_(FOUND|NOT_SEEN_COVERAGE_UNVERIFIED)=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one\|(MeasureTheory.integral_integral_swap|Real.fourier_mul_convolution_eq)$' "$HVR_EVIDENCE/root-swap-path.stdout.log")"
          test "$ROOT_OBSERVATIONS" -eq 2
          grep -Fx 'PATH_THEOREM_BODIES_UNAVAILABLE=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          grep -Fx 'PATH_DECLARATIONS_MISSING=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          grep -E '^PATH_|^SWAP_PATH_|^DEPENDENCY_COVERAGE|^SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-swap-path.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct ordinary-wave root dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVROrdinaryWaveRootTrace.lean" | tee "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log"
          grep -Fx 'POSITIVE_CONTROL_DETECTED=HVRCompactConvolutionTraceControls.swapIndirect|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPhysicalKernelCandidate.wave|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVROrdinarySeedWave.ordinaryWave|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPhysicalKernelSpectralIdentity.fourierInv_correlation_eq_rawKernel|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hvr-theta-linux-evidence
          path: HILBERT-SUPERIORITY-PNT/evidence-linux/
          if-no-files-found: warn
