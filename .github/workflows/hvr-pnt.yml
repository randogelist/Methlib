name: HVR full PNT composition (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theta-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify branch Lean sources and build plan
        shell: bash
        run: |
          set -euo pipefail
          echo "ea47729237124fb12f60f40733bd4617dfcd96e1538bcc0422e89c0cadd22415  HILBERT-SUPERIORITY-PNT/branch_sources.sha256" | sha256sum --check
          (cd HILBERT-SUPERIORITY-PNT && sha256sum --check branch_sources.sha256)

      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Fetch pinned Mathlib cache
        working-directory: .ci-mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get

      - name: Build and audit theta root
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          "$LEAN_EXE" --version
          python3 HILBERT-SUPERIORITY-PNT/hvr_linux.py

      - name: Diagnose DCT dependencies of root and half-line theorem
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          export HVR_CAND="$HVR_PKG/major-mathlib/major_mathlib_dominated_convergence"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          test -f "$HVR_EVIDENCE/lean-path.txt"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$HVR_CAND/candidates" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRDCTTraceControlLeaf.olean" HVRDCTTraceControlLeaf.lean)
          (cd "$HVR_CAND/candidates" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRDCTTraceControlBridge.olean" HVRDCTTraceControlBridge.lean)
          "$LEAN_EXE" "$HVR_CAND/diagnostics/HVRRootDCTDiagnostic.lean" | tee "$HVR_EVIDENCE/root-dct-diagnostic.stdout.log"
          echo 'Root diagnostic reports findings; it does not assert semantic independence.' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|TARGET_MODULE_DECLARATIONS_COUNT|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-dct-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Diagnose Mellin dependency of root and Abel helper
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          export HVR_DIAG="$HVR_PKG/mellin-diagnostics"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          test -f "$HVR_EVIDENCE/lean-path.txt"
          test -f "$HVR_EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$HVR_DIAG" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRMellinTraceControlLeaf.olean" HVRMellinTraceControlLeaf.lean)
          (cd "$HVR_DIAG" && "$LEAN_EXE" -o "$HVR_EVIDENCE/olean/HVRMellinTraceControlBridge.olean" HVRMellinTraceControlBridge.lean)
          "$LEAN_EXE" "$HVR_DIAG/HVRMellinRootDiagnostic.lean" | tee "$HVR_EVIDENCE/root-mellin-diagnostic.stdout.log"
          echo 'Mellin diagnostic reports selected declaration findings; negative coverage remains unverified.' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|TARGET_MODULE_DECLARATIONS_COUNT|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-mellin-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose refactored prime-mode dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRModeDependencyDiagnostic.lean" | tee "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeMellinModeAssembly.primeSeries_eq_mul_mellin_via_modes' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRZetaBoundaryFactor.zeta_boundary_finite_order|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRZetaLogDerivative.vonMangoldt_series_eq_zeta_log_deriv|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|riemannZeta_ne_zero_of_one_lt_re' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-mode-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose Chebyshev bound dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRChebyshevDependencyDiagnostic.lean" | tee "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeChebyshevBound.theta_le_log4_mul_x_native' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Chebyshev.theta_le_log4_mul_x' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-chebyshev-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose integrated Fourier replacement
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRFourierTargetDiagnostic.lean" | tee "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log"
          grep -Fx 'FOURIER_CANDIDATE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRActualBoundaryFourier.ordinaryBoundary_tendsto_zero' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FOURIER_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Real.tendsto_integral_exp_smul_cocompact' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >/dev/null
          grep -E '^FOURIER_' "$HVR_EVIDENCE/root-fourier-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose near-pole dependency
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -n "$HVR_EVIDENCE"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRPoleFeatureTrace.lean" | tee "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log"
          grep -Fx 'FEATURE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeZetaPoleLittleO.zeta_log_derivative_regularized_isLittleO' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FEATURE_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|log_deriv_riemannZeta_add_inv_sub_sub_isLittleO' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >/dev/null
          grep -E '^FEATURE_' "$HVR_EVIDENCE/root-pole-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct frequency measurability
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRFrequencyMeasurableTrace.lean" | tee "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log"
          grep -Fx 'FREQ_MEAS_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FREQ_MEAS_TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >/dev/null
          grep -E '^FREQ_MEAS_' "$HVR_EVIDENCE/root-frequency-measurable-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct complex exponential path
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRComplexExpDirectTrace.lean" | tee "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log"
          grep -Fx 'EXP_DIRECT_TARGET_FOUND=HVRComplexPoleLaplace.exponential_integrable|HVRComplexExpIntegralDirect.exponential_integrable_direct' "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log" >/dev/null
          grep -E '^EXP_DIRECT_' "$HVR_EVIDENCE/root-complex-exp-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose real reflection and residual swap paths
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          for NAME in HVRRealReflectionTrace HVRPrimeResidualSwapTrace; do
            "$LEAN" "$HVR_PKG/mellin-diagnostics/$NAME.lean" | tee "$HVR_EVIDENCE/$NAME.stdout.log"
            grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/$NAME.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          done
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRRealReflection.real_volume_negInvariant_direct|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/HVRRealReflectionTrace.stdout.log" >/dev/null

      - name: Inspect explicit root swap path
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          timeout 480 "$LEAN" "$HVR_PKG/mellin-diagnostics/HVRPrimeSwapPathTrace.lean" | tee "$HVR_EVIDENCE/root-swap-path.stdout.log"
          for ENTRY in \
            'HVRPrimeSwapPathControl.swapDirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.swapIndirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.convolutionDirect|Real.fourier_mul_convolution_eq' \
            'HVRPrimeSwapPathControl.convolutionIndirect|Real.fourier_mul_convolution_eq'; do
            grep -Fx "PATH_CONTROL_DETECTED=$ENTRY" "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          done
          ROOT_OBSERVATIONS="$(grep -Ec '^PATH_TARGET_(FOUND|NOT_SEEN_COVERAGE_UNVERIFIED)=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one\|(MeasureTheory.integral_integral_swap|Real.fourier_mul_convolution_eq)$' "$HVR_EVIDENCE/root-swap-path.stdout.log")"
          test "$ROOT_OBSERVATIONS" -eq 2
          grep -Fx 'PATH_THEOREM_BODIES_UNAVAILABLE=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          grep -Fx 'PATH_DECLARATIONS_MISSING=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$HVR_EVIDENCE/root-swap-path.stdout.log" >/dev/null
          grep -E '^PATH_|^SWAP_PATH_|^DEPENDENCY_COVERAGE|^SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/root-swap-path.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Diagnose direct ordinary-wave root dependencies
        shell: bash
        run: |
          set -euo pipefail
          HVR_PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT"
          HVR_EVIDENCE="$(find "$HVR_PKG/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)"
          export LEAN_PATH="$(paste -sd ':' "$HVR_EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          "$LEAN" "$HVR_PKG/mellin-diagnostics/HVROrdinaryWaveRootTrace.lean" | tee "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log"
          grep -Fx 'POSITIVE_CONTROL_DETECTED=HVRCompactConvolutionTraceControls.swapIndirect|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPhysicalKernelCandidate.wave|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVROrdinarySeedWave.ordinaryWave|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPhysicalKernelSpectralIdentity.fourierInv_correlation_eq_rawKernel|MeasureTheory.integral_integral_swap' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$HVR_EVIDENCE/ordinary-wave-root-trace.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hvr-theta-linux-evidence
          path: HILBERT-SUPERIORITY-PNT/evidence-linux/
          if-no-files-found: warn
  integration:
    name: Full integration plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare and verify the complete integration plan
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          cp -a "$PKG" "$RUNNER_TEMP/hvr-root"
          python3 "$RUNNER_TEMP/hvr-root/run_linux.py" --check-plan
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify pinned Mathlib and fetch its cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Build and audit named theorems
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          python3 "$RUNNER_TEMP/hvr-root/run_linux.py"
      - name: Diagnose the selected Mellin dependency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'MELLIN_DIAGNOSTIC=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check diagnostics.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && "$LEAN" -o "$EVIDENCE/olean/HVRMellinTraceControlLeaf.olean" HVRMellinTraceControlLeaf.lean)
          (cd "$PKG/diagnostics" && "$LEAN" -o "$EVIDENCE/olean/HVRMellinTraceControlBridge.olean" HVRMellinTraceControlBridge.lean)
          (cd "$PKG/diagnostics" && "$LEAN" HVRMellinRootDiagnostic.lean) | tee "$EVIDENCE/mellin-diagnostic.stdout.log"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|TARGET_MODULE_DECLARATIONS_COUNT|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/mellin-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          (cd "$PKG/diagnostics" && "$LEAN" HVRModeDependencyDiagnostic.lean) | tee "$EVIDENCE/mode-diagnostic.stdout.log"
          (cd "$PKG/diagnostics" && "$LEAN" HVRFeatureTrace.lean) | tee "$EVIDENCE/pole-diagnostic.stdout.log"
          grep -Fx 'FEATURE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeZetaPoleLittleO.zeta_log_derivative_regularized_isLittleO' "$EVIDENCE/pole-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FEATURE_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|log_deriv_riemannZeta_add_inv_sub_sub_isLittleO' "$EVIDENCE/pole-diagnostic.stdout.log" >/dev/null
          grep -E '^FEATURE_' "$EVIDENCE/pole-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          (cd "$PKG/diagnostics" && "$LEAN" HVRFourierTargetDiagnostic.lean) | tee "$EVIDENCE/fourier-diagnostic.stdout.log"
          grep -Fx 'FOURIER_CANDIDATE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRActualBoundaryFourier.ordinaryBoundary_tendsto_zero' "$EVIDENCE/fourier-diagnostic.stdout.log" >/dev/null
          grep -Fx 'FOURIER_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Real.tendsto_integral_exp_smul_cocompact' "$EVIDENCE/fourier-diagnostic.stdout.log" >/dev/null
          grep -E '^FOURIER_' "$EVIDENCE/fourier-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          grep -F 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeMellinModeAssembly.primeSeries_eq_mul_mellin_via_modes' "$EVIDENCE/mode-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRZetaBoundaryFactor.zeta_boundary_finite_order|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRIntegratedZetaNonzero.zeta_ne_zero_of_one_lt_re' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRZetaLogDerivative.vonMangoldt_series_eq_zeta_log_deriv|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRMajorZetaLogDerivative.vonMangoldt_LSeries_eq_neg_logDeriv_zeta' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|ArithmeticFunction.LSeries_vonMangoldt_eq_deriv_riemannZeta_div' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|riemannZeta_ne_zero_of_one_lt_re' "$EVIDENCE/mode-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/mode-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          (cd "$PKG/diagnostics" && "$LEAN" HVRChebyshevDependencyDiagnostic.lean) | tee "$EVIDENCE/chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeChebyshevBound.theta_le_log4_mul_x_native' "$EVIDENCE/chebyshev-diagnostic.stdout.log"
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|Chebyshev.theta_le_log4_mul_x' "$EVIDENCE/chebyshev-diagnostic.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/chebyshev-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Diagnose remaining root swap dependency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'ROOT_SWAP_DIAGNOSTIC=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check diagnostics.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && "$LEAN" HVRPrimeResidualSwapTrace.lean) | tee "$EVIDENCE/residual-swap-diagnostic.stdout.log"
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/residual-swap-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Inspect explicit root swap and convolution paths
        if: always()
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'ROOT_SWAP_PATH=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check diagnostics.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && timeout 480 "$LEAN" HVRPrimeSwapPathTrace.lean) | tee "$EVIDENCE/swap-path-diagnostic.stdout.log"
          for ENTRY in \
            'HVRPrimeSwapPathControl.swapDirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.swapIndirect|MeasureTheory.integral_integral_swap' \
            'HVRPrimeSwapPathControl.convolutionDirect|Real.fourier_mul_convolution_eq' \
            'HVRPrimeSwapPathControl.convolutionIndirect|Real.fourier_mul_convolution_eq'; do
            grep -Fx "PATH_CONTROL_DETECTED=$ENTRY" "$EVIDENCE/swap-path-diagnostic.stdout.log" >/dev/null
          done
          ROOT_OBSERVATIONS="$(grep -Ec '^PATH_TARGET_(FOUND|NOT_SEEN_COVERAGE_UNVERIFIED)=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one\|(MeasureTheory.integral_integral_swap|Real.fourier_mul_convolution_eq)$' "$EVIDENCE/swap-path-diagnostic.stdout.log")"
          test "$ROOT_OBSERVATIONS" -eq 2
          grep -Fx 'PATH_THEOREM_BODIES_UNAVAILABLE=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$EVIDENCE/swap-path-diagnostic.stdout.log" >/dev/null
          grep -Fx 'PATH_DECLARATIONS_MISSING=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|0' "$EVIDENCE/swap-path-diagnostic.stdout.log" >/dev/null
          grep -E '^PATH_|^SWAP_PATH_|^DEPENDENCY_COVERAGE|^SEMANTIC_INDEPENDENCE' "$EVIDENCE/swap-path-diagnostic.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Diagnose root replacement components
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'REPLACEMENT_DIAGNOSTICS=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check HVRFrequencyMeasurableTrace.sha256 HVRComplexExpDirectTrace.sha256 HVRRealReflectionTrace.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          for NAME in HVRFrequencyMeasurableTrace HVRComplexExpDirectTrace HVRRealReflectionTrace; do
            (cd "$PKG/diagnostics" && "$LEAN" "$NAME.lean") | tee "$EVIDENCE/$NAME.stdout.log"
            grep -E 'CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|BODIES_UNAVAILABLE|DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/$NAME.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
          done
          grep -Fx 'FREQ_MEAS_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable|MeasureTheory.integral_integral_swap' "$EVIDENCE/HVRFrequencyMeasurableTrace.stdout.log" >/dev/null
          grep -Fx 'FREQ_MEAS_TARGET_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRPrimeBoundaryFrequencyMeasurable.frequencyIntegrand_aestronglyMeasurable' "$EVIDENCE/HVRFrequencyMeasurableTrace.stdout.log" >/dev/null
          grep -Fx 'EXP_DIRECT_TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRComplexPoleLaplace.exponential_integrable|MeasureTheory.integral_integral_swap' "$EVIDENCE/HVRComplexExpDirectTrace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRRealReflection.real_volume_negInvariant_direct|MeasureTheory.integral_integral_swap' "$EVIDENCE/HVRRealReflectionTrace.stdout.log" >/dev/null
      - name: Diagnose ordinary wave root path
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$EVIDENCE" ] || [ ! -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean" ]; then
            echo 'ORDINARY_WAVE_DIAGNOSTIC=NOT_RUN_ROOT_NOT_BUILT'
            exit 0
          fi
          (cd "$PKG" && sha256sum --check diagnostics.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && "$LEAN" HVROrdinaryWaveRootTrace.lean) | tee "$EVIDENCE/ordinary-wave-root-trace.stdout.log"
          grep -Fx 'POSITIVE_CONTROL_DETECTED=HVRCompactConvolutionTraceControls.swapIndirect|MeasureTheory.integral_integral_swap' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'POSITIVE_CONTROL_DETECTED=HVRCompactConvolutionTraceControls.convolutionIndirect|Real.fourier_mul_convolution_eq' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_FOUND=HVRPhysicalKernelCandidate.wave|MeasureTheory.integral_integral_swap' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVROrdinarySeedWave.ordinaryWave|MeasureTheory.integral_integral_swap' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -Fx 'TARGET_NOT_SEEN_COVERAGE_UNVERIFIED=HVRPhysicalKernelSpectralIdentity.fourierInv_correlation_eq_rawKernel|MeasureTheory.integral_integral_swap' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >/dev/null
          grep -E 'POSITIVE_CONTROL|TARGET_FOUND|TARGET_NOT_SEEN|REACHED_THEOREM|REACHED_DECLARATIONS_MISSING|DEPENDENCY_COVERAGE|SEMANTIC_INDEPENDENCE' "$EVIDENCE/ordinary-wave-root-trace.stdout.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload lane audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-full-integration-linux-evidence
          path: ${{ runner.temp }}/hvr-root/evidence-linux/
          if-no-files-found: warn
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate and select dependency-closed sources
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          python3 "$PKG/prepare_lane.py" --package "$PKG" --output "$RUNNER_TEMP/hvr-wave-legacy" --lane wave_legacy_compatibility
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify Mathlib and fetch cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Build and audit named declarations
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          python3 "$RUNNER_TEMP/hvr-wave-legacy/run_linux.py"
      - name: Upload candidate audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-wave-legacy-linux-evidence
          path: ${{ runner.temp }}/hvr-wave-legacy/evidence-linux/
          if-no-files-found: warn
  windows-powershell:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Parse PowerShell scripts and check canonical plan
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          $root = Join-Path $env:GITHUB_WORKSPACE 'HILBERT-SUPERIORITY-PNT'
          foreach ($file in @('run.ps1', 'zetahyperbolic-integration/run.ps1')) {
            $path = Join-Path $root $file
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host ("PARSER_ERROR={0}:{1}:{2}" -f $file,$_.Extent.StartLineNumber,$_.Message) }
              throw "Parsing failed: $file"
            }
            Write-Host "PARSER_PASS=$file"
          }
          # Evaluate only the literal plan, not the runner or Lean.
          $canonical = Get-Content -LiteralPath (Join-Path $root 'run.ps1') -Raw
          $match = [regex]::Match($canonical, '(?ms)^[ \t]*\$plan[ \t]*=[ \t]*@\([^\r\n]*\r?\n.*?^[ \t]*\)')
          if (-not $match.Success) { throw 'Canonical plan was not located' }
          $block = [scriptblock]::Create($match.Value + [Environment]::NewLine + 'return ,$plan')
          $plan = & $block
          $auditCount = ($plan | ForEach-Object { $_.names.Count } | Measure-Object -Sum).Sum
          Write-Host "CANONICAL_PLAN_COUNT=$($plan.Count)"
          Write-Host "CANONICAL_NAMED_AUDITS=$auditCount"
          if ($plan.Count -eq 0 -or $auditCount -eq 0) { throw 'Empty canonical plan or audit list' }
          if ($plan[-1].module -ne 'HVR_PrimeDensity_FinalRoot') { throw 'Unexpected canonical final module' }
          $names = @($plan | ForEach-Object { $_.module })
          if (($names | Select-Object -Unique).Count -ne $names.Count) { throw 'Duplicate modules in canonical plan' }
          Write-Host 'POWERSHELL_PLAN_CHECK=PASS'
  full-pnt-result:
    name: Full PNT composition result
    if: always()
    needs: [theta-linux, integration, legacy, windows-powershell]
    runs-on: ubuntu-latest
    steps:
      - name: Require all composition audits
        shell: bash
        env:
          THETA: ${{ needs.theta-linux.result }}
          INTEGRATION: ${{ needs.integration.result }}
          LEGACY: ${{ needs.legacy.result }}
          WINDOWS: ${{ needs.windows-powershell.result }}
        run: |
          set -euo pipefail
          printf 'Canonical theta: %s\nFull integration: %s\nLegacy compatibility: %s\nWindows syntax: %s\n' "$THETA" "$INTEGRATION" "$LEGACY" "$WINDOWS" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$THETA" = success
          test "$INTEGRATION" = success
          test "$LEGACY" = success
          test "$WINDOWS" = success
