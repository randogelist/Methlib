name: HVR Zetahyperbolic integration (Linux)
on:
  workflow_dispatch:
  push:
    paths:
      - 'HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration/**'
      - '.github/workflows/hvr-zetahyperbolic-integration.yml'

permissions:
  contents: read

jobs:
  integration:
    name: Integration / ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        lane: [root]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify full source manifest and prepare the independent lane
        shell: bash
        env:
          HVR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          python3 "$PKG/prepare_lane.py" --package "$PKG" --output "$RUNNER_TEMP/hvr-$HVR_LANE" --lane "$HVR_LANE"
      - name: Check out pinned Mathlib
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leanprover-community/mathlib4
          ref: fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0
          path: .ci-mathlib
          persist-credentials: false
      - name: Install Lean
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: .ci-mathlib
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify pinned Mathlib and fetch its cache
        shell: bash
        working-directory: .ci-mathlib
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = 'leanprover/lean4:v4.34.0-rc1'
          test "$(git rev-parse HEAD)" = 'fd9375dc1e3b113b2ddc599f4ebb59d11d4c60d0'
          "$HOME/.elan/bin/lake" exe cache get
      - name: Build and audit named theorems
        shell: bash
        env:
          MATHLIB_CACHE_ROOT: ${{ github.workspace }}/.ci-mathlib
          HVR_LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          export LEAN_EXE="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          test -x "$LEAN_EXE"
          python3 "$RUNNER_TEMP/hvr-$HVR_LANE/run_linux.py"
      - name: Trace feature theorem and old target
        shell: bash
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/HILBERT-SUPERIORITY-PNT/zetahyperbolic-integration"
          LANE="$RUNNER_TEMP/hvr-root"
          EVIDENCE="$(find "$LANE/evidence-linux" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          test -f "$EVIDENCE/olean/HVR_PrimeDensity_FinalRoot.olean"
          (cd "$PKG" && sha256sum --check feature-trace.sha256)
          export LEAN_PATH="$(cat "$EVIDENCE/lean-path.txt")"
          LEAN="$HOME/.elan/toolchains/leanprover--lean4---v4.34.0-rc1/bin/lean"
          (cd "$PKG/diagnostics" && "$LEAN" HVRFeatureTrace.lean) | tee "$EVIDENCE/feature-trace.stdout.log"
          grep -Fx 'FEATURE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|HVRNativeZetaPoleLittleO.zeta_log_derivative_regularized_isLittleO' "$EVIDENCE/feature-trace.stdout.log"
          if grep -Fx 'FEATURE_FOUND=HVRPrimeDensityFinalRoot.theta_ratio_tendsto_one|log_deriv_riemannZeta_add_inv_sub_sub_isLittleO' "$EVIDENCE/feature-trace.stdout.log"; then
            echo 'FEATURE_TARGET_STILL_REACHED=YES'
            exit 1
          fi
          if grep -Fx 'FEATURE_FOUND=HVRNativeZetaPoleLittleO.zeta_log_derivative_regularized_isLittleO|log_deriv_riemannZeta_add_inv_sub_sub_isLittleO' "$EVIDENCE/feature-trace.stdout.log"; then
            echo 'FEATURE_CANDIDATE_REACHES_TARGET=YES'
            exit 1
          fi
          grep -E '^FEATURE_' "$EVIDENCE/feature-trace.stdout.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lane audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hvr-zetahyperbolic-${{ matrix.lane }}-linux-evidence
          path: ${{ runner.temp }}/hvr-${{ matrix.lane }}/evidence-linux/
          if-no-files-found: warn
