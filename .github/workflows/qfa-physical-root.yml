name: QFA physical root / conditional formal closure audit

on:
  push:
    branches: [QFA]
    paths:
      - 'Quasi-Fefferman-A/PhysicalRoot/**'
      - '.github/workflows/qfa-physical-root.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qfa-physical-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  physical-root-audit:
    name: Lean 4.33.0 / LE109-LE112 / conditional root
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Quasi-Fefferman-A/PhysicalRoot
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      LEAN_NUM_THREADS: '2'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            Quasi-Fefferman-A
            .github/workflows/qfa-physical-root.yml
          sparse-checkout-cone-mode: false

      - name: Verify exact baseline and root source inventory
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          python scripts/root_audit.py --static

      - name: Restore native Lean toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: qfa-elan-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Quasi-Fefferman-A/PhysicalRoot/lean-toolchain') }}

      - name: Restore pinned dependency objects
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/packages
          key: qfa-physical-dependencies-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Quasi-Fefferman-A/PhysicalRoot/lean-toolchain', 'Quasi-Fefferman-A/PhysicalRoot/lake-manifest.json') }}

      - name: Restore incremental physical-root objects
        id: root-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/build
          key: qfa-physical-root-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Quasi-Fefferman-A/PhysicalRoot/lean-toolchain', 'Quasi-Fefferman-A/PhysicalRoot/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            qfa-physical-root-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Quasi-Fefferman-A/PhysicalRoot/lean-toolchain', 'Quasi-Fefferman-A/PhysicalRoot/lake-manifest.json') }}-

      - name: Restore compiled Lake configurations
        id: config-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/config
          key: qfa-physical-config-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Quasi-Fefferman-A/PhysicalRoot/lean-toolchain', 'Quasi-Fefferman-A/PhysicalRoot/lake-manifest.json', 'Quasi-Fefferman-A/PhysicalRoot/lakefile.lean') }}

      - name: Install pinned native toolchain
        id: toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: Quasi-Fefferman-A/PhysicalRoot
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Bind native Windows Elan path
        run: |
          $elanBin = Join-Path $env:USERPROFILE '.elan\bin'
          if (!(Test-Path (Join-Path $elanBin 'lake.exe'))) {
            throw 'Missing native Lake proxy'
          }
          $elanBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build baseline and audit conditional physical root
        id: audit
        shell: cmd
        run: root-run.cmd

      - name: Preserve native toolchain cache
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.elan
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Preserve verified dependency objects
        if: ${{ !cancelled() && hashFiles('Quasi-Fefferman-A/PhysicalRoot/root-evidence/cache-ready.json') != '' && steps.dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/packages
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Preserve compiled Lake configurations
        if: ${{ !cancelled() && hashFiles('Quasi-Fefferman-A/PhysicalRoot/root-evidence/cache-ready.json') != '' && steps.config-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/config
          key: ${{ steps.config-cache.outputs.cache-primary-key }}

      - name: Preserve incremental physical-root objects
        if: ${{ !cancelled() && hashFiles('Quasi-Fefferman-A/PhysicalRoot/root-evidence/cache-ready.json') != '' && steps.root-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: Quasi-Fefferman-A/PhysicalRoot/.lake/build
          key: ${{ steps.root-cache.outputs.cache-primary-key }}

      - name: Upload exact compiler and axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qfa-physical-root-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: Quasi-Fefferman-A/PhysicalRoot/root-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload tested physical-root package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qfa-physical-root-source-${{ github.sha }}
          path: |
            Quasi-Fefferman-A/PhysicalRoot
            !Quasi-Fefferman-A/PhysicalRoot/.lake
            !Quasi-Fefferman-A/PhysicalRoot/root-evidence
            !Quasi-Fefferman-A/PhysicalRoot/**/__pycache__
            Quasi-Fefferman-A/CI/9b6ca616b2f26e0222decb872401752e8320babe/VERIFICATION.txt
            .github/workflows/qfa-physical-root.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
