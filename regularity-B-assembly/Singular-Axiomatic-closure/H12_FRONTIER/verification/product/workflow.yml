name: H12 PRODUCT adapter sixteen checkpoints

on:
  pull_request:
    branches: [H12_extension]
    types: [opened, synchronize, reopened]
    paths:
      - 'regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER/SingularClosure/H12Frontier/Product*.lean'
      - 'regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER/ci/product_plan.json'
      - 'regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER/ci/product_audits/**'
      - 'regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER/ci/build_product_adapter.py'
      - '.github/workflows/h12-product-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h12-product-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  product:
    name: Lean 4.33.0 / P01-P16 exact checkpoints
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: package
        shell: bash
    env:
      PROJECT: regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SOURCE_SHA: 59a220c10f4f1600498c1b423b809695fb58a92f
      MATHLIB_REV: db584cd6d46c92f209a44c0f1c829460d327499d
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout exact adapter source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repository
          persist-credentials: false
          sparse-checkout: |
            regularity-B-assembly/Singular-Axiomatic-closure/H12_FRONTIER
            .github/workflows/h12-product-adapter.yml
      - name: Extract source and verify inherited Lean files
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git -C repository rev-parse HEAD)" = "$SOURCE_SHA"
          git -C repository fetch --no-tags --depth=1 origin "$BASE_SOURCE_SHA"
          mkdir package
          git -C repository archive "$SOURCE_SHA:$PROJECT" | tar -xf - -C package
          mkdir -p package/evidence/product
          echo "$SOURCE_SHA" > package/evidence/commit.txt
          echo "$GITHUB_SHA" > package/evidence/workflow-event-sha.txt
          echo "$BASE_SOURCE_SHA" > package/evidence/base-source-commit.txt
          git -C repository archive --format=zip "$SOURCE_SHA:$PROJECT" > package/evidence/source_snapshot.zip
          cp repository/.github/workflows/h12-product-adapter.yml package/evidence/workflow.yml
          git -C repository diff --name-status "$BASE_SOURCE_SHA" "$SOURCE_SHA" -- "$PROJECT" > package/evidence/base-diff.txt
          python3 - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SOURCE_SHA']
          head = os.environ['SOURCE_SHA']
          prefix = os.environ['PROJECT'] + '/'
          names = subprocess.check_output(['git','-C','repository','ls-tree','-r','--name-only',base,prefix],text=True).splitlines()
          for name in names:
              if name.endswith('.lean') or name in [prefix+'lean-toolchain',prefix+'lake-manifest.json',prefix+'lakefile.toml']:
                  before = subprocess.check_output(['git','-C','repository','rev-parse',base+':'+name],text=True).strip()
                  after = subprocess.check_output(['git','-C','repository','rev-parse',head+':'+name],text=True).strip()
                  if before != after:
                      raise SystemExit('INHERITED_SOURCE_CHANGED:'+name)
          print('INHERITED_LEAN_AND_PINS_UNCHANGED')
          PY
          cd package
          sha256sum lake-manifest.json > evidence/lockfile-before.sha256
      - name: Install pinned toolchain without building
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: package
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore dependency cache
        id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/packages
          key: singular-ax6-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}
      - name: Restore compiled project cache
        id: project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/build
          key: h12-product-adapter-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-${{ hashFiles('package/SingularClosure/**/*.lean', 'package/ci/product_audits/*.lean') }}
          restore-keys: |
            h12-product-adapter-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-
            h12-frontier-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-
      - name: Require both caches and verify compiler pins
        id: cached
        env:
          DEPENDENCY_CACHE_KEY: ${{ steps.deps.outputs.cache-matched-key }}
          PROJECT_CACHE_KEY: ${{ steps.project.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_CACHE_KEY"
          test -n "$PROJECT_CACHE_KEY"
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test -s .lake/build/lib/lean/SingularClosure/H12Frontier/ReplayClosure.olean
          lean --version | tee evidence/lean-version.txt
          grep -F 'version 4.33.0,' evidence/lean-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee evidence/mathlib-revision.txt
          test "$(cat evidence/mathlib-revision.txt)" = "$MATHLIB_REV"
          sha256sum --check evidence/lockfile-before.sha256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/cache.json').write_text(json.dumps({
              'dependency_cache':'RESTORED',
              'project_cache':'RESTORED',
              'dependency_cache_key':os.environ['DEPENDENCY_CACHE_KEY'],
              'project_cache_key':os.environ['PROJECT_CACHE_KEY'],
              'uncached_fallback':False,
          },indent=2)+'\n')
          PY
      - name: Compile and audit sixteen product checkpoints
        id: product
        run: python3 ci/build_product_adapter.py
      - name: Preserve incremental compiler cache
        if: always() && steps.cached.outcome == 'success' && steps.project.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/build
          key: ${{ steps.project.outputs.cache-primary-key }}
      - name: Upload exact source and proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h12-product-adapter-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/evidence
          if-no-files-found: error
