name: Critical Hhalf small-data closure

on:
  push:
    branches: [main, codex/h12-small-unconditional]
    paths:
      - 'regularity-B-assembly/Singular-Axiomatic-closure/**'
      - '.github/workflows/h12-small-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h12-small-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-extension:
    name: Lean 4.33.0 / critical extension
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: package
        shell: bash
    env:
      PROJECT: regularity-B-assembly/Singular-Axiomatic-closure
      MATHLIB_REV: db584cd6d46c92f209a44c0f1c829460d327499d
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout the exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: repository
          sparse-checkout: |
            regularity-B-assembly/Singular-Axiomatic-closure
            .github/workflows/h12-small-closure.yml
          persist-credentials: false

      - name: Extract and hash the source
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git -C repository rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir package
          git -C repository archive "$GITHUB_SHA:$PROJECT" | tar -xf - -C package
          mkdir package/evidence
          echo "$GITHUB_SHA" > package/evidence/commit.txt
          cp repository/.github/workflows/h12-small-closure.yml package/evidence/workflow.yml
          cd package
          python3 ci/check_sources.py | tee evidence/source-policy.json
          sha256sum lake-manifest.json > evidence/lockfile-before.sha256

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: package
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'

      - name: Restore pinned dependency cache
        id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/packages
          key: singular-ax6-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}

      - name: Verify dependencies and fetch cached Mathlib objects
        run: |
          set -euo pipefail
          lean --version | tee evidence/lean-version.txt
          grep -F 'version 4.33.0,' evidence/lean-version.txt
          lake exe cache get 2>&1 | tee evidence/cache.log
          git -C .lake/packages/mathlib rev-parse HEAD | tee evidence/mathlib-revision.txt
          test "$(cat evidence/mathlib-revision.txt)" = "$MATHLIB_REV"
          test -s .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          sha256sum --check evidence/lockfile-before.sha256

      - name: Preserve dependency cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/packages
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore project cache
        id: project
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/build
          key: h12-small-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-${{ hashFiles('package/SingularClosure/**/*.lean', 'package/ci/CriticalAudit.lean') }}
          restore-keys: |
            h12-small-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-
            singular-ax6-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package/lean-toolchain', 'package/lake-manifest.json') }}-

      - name: Compile each extension module
        id: extension
        run: |
          python3 ci/test_build_critical.py
          python3 ci/build_critical.py

      - name: Audit extension theorem dependencies
        if: always() && steps.extension.outcome == 'success'
        run: |
          set -euo pipefail
          lake env lean ci/CriticalAudit.lean 2>&1 | tee evidence/critical-axioms.log
          python3 ci/check_axioms.py evidence/critical-axioms.log ci/expected_critical_axioms.json | tee evidence/critical-audit.json

      - name: Recheck the frozen root and its exact type
        if: always() && steps.project.outcome == 'success'
        run: |
          set -euo pipefail
          lake build SingularClosure.Root 2>&1 | tee evidence/frozen-root-build.log
          lake env lean ci/EndpointAudit11.lean 2>&1 | tee evidence/frozen-root-axioms.log
          python3 ci/check_axioms.py evidence/frozen-root-axioms.log ci/expected_endpoint_11.json | tee evidence/frozen-root-audit.json

      - name: Recheck all original package endpoints
        if: always() && steps.extension.outcome == 'success'
        run: |
          set -euo pipefail
          lake build SingularClosure 2>&1 | tee evidence/full-package-build.log
          python3 ci/test_check_axioms.py 2>&1 | tee evidence/audit-checker-tests.log
          lake env lean ci/Audit.lean 2>&1 | tee evidence/full-package-axioms.log
          python3 ci/check_axioms.py evidence/full-package-axioms.log ci/expected_axioms.json | tee evidence/full-package-audit.json

      - name: Preserve checked compiler objects
        if: always() && steps.project.outcome == 'success' && steps.project.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: package/.lake/build
          key: ${{ steps.project.outputs.cache-primary-key }}

      - name: Upload compiler and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h12-small-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: package/evidence
          if-no-files-found: error
